name: Pull Request Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend changes
        id: frontend_changes
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"

          {
            echo "Changed files:"
            printf '%s\n' "$changed_files"
          } >> "$GITHUB_STEP_SUMMARY"

          if printf '%s\n' "$changed_files" | grep -Eq '^frontend/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip frontend checks
        if: steps.frontend_changes.outputs.changed != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No frontend-impacting changes detected; skipping frontend quality commands."

      - name: Set up Node.js
        if: steps.frontend_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_changes.outputs.changed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.frontend_changes.outputs.changed == 'true'
        run: npm run test

      - name: Install Playwright Chromium
        if: steps.frontend_changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E checks
        if: steps.frontend_changes.outputs.changed == 'true'
        run: npm run e2e

      - name: Run Lighthouse CI budgets
        if: steps.frontend_changes.outputs.changed == 'true'
        run: npm run lhci
